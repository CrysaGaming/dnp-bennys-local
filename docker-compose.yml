# Deploy-Compose für Coolify. Sie muss im Root liegen und `docker-compose.yml` heißen – Coolify
# scannt das Repo und erkennt nur diesen Namen im Root.
#
# Es ist nichts in Coolify zu setzen: Coolify erzeugt die Werte für `SERVICE_*` selbst und schreibt
# sie in seine Env-Datei (`bootstrap/helpers/shared.php`, `generateEnvValue`). Die Generate-Namen
# stehen unter Variables in Coolify – dort liest man das Startpasswort für den ersten Login ab.
# Nach dem ersten Login muss der Admin es ändern (Spec 3.4), dann ist der generierte Wert egal.
# Funk-Kanal und Funk-Passwort bleiben draußen: sie sind nullable und werden in den
# Firmeneinstellungen gesetzt (Spec 13.4). Fehlen sie, setzt der Seed einfach nichts.
#
# `SERVICE_FQDN_APP_3000` ist die Domain mit Port – danach richtet Coolify den Proxy aus
# (`ServiceApplication::getRequiredPort`). Die Port-Angabe darf nicht fehlen, sonst kennt Coolify
# den Port des Containers nicht.
#
# Die lokalen Datenbanken (5434 Dev, 5435 Test) laufen aus `docker-compose.dev.yml` – das nutzt
# `npm run db:up`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - DATABASE_URL=postgresql://bennys:${SERVICE_PASSWORD_DB}@db:5432/bennys
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_APP}
      - BETTER_AUTH_URL=${SERVICE_FQDN_APP_3000}
      - SEED_ADMIN_USERNAME=${SERVICE_USER_APP}
      - SEED_ADMIN_PASSWORD=${SERVICE_PASSWORD_APP}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # 127.0.0.1 statt localhost: busybox in Alpine löst localhost auf ::1 auf, der Server horcht
    # auf IPv4 (ENV HOSTNAME=0.0.0.0 im Dockerfile). Curl gibt es im Image nicht, wget schon.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bennys
      - POSTGRES_DB=bennys
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bennys -d bennys"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  pgdata:
  uploads:
