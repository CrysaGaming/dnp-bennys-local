# Deploy-Compose für Coolify. Sie muss im Root liegen und `docker-compose.yml` heißen – Coolify
# scannt das Repo und erkennt nur diesen Namen im Root.
#
# Die Form ist die, die Coolify selbst erzeugt: `SERVICE_*`-Platzhalter, die Coolify füllt
# (`generateEnvValue` in `bootstrap/helpers/shared.php`), Healthchecks, `depends_on` mit
# `service_healthy`, `restart: unless-stopped`. Nichts in Coolify setzen – Deploy drücken reicht.
# Die generierten Werte stehen in Coolify unter Variables; dort steht auch das Startpasswort für den
# ersten Login. Danach muss der Admin es ändern (Spec 3.4).
#
# `SERVICE_FQDN_APP_3000` mit Port: Coolify liest den Port aus der FQDN-Variable, die direkt im Dienst
# steht (`ServiceApplication::getRequiredPort`). Ohne die Zahl kennt Coolify den Port nicht.
#
# Die lokalen Datenbanken (5434 Dev, 5435 Test) laufen aus `docker-compose.dev.yml` – das nutzt
# `npm run db:up`.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SERVICE_FQDN_APP_3000
      - DATABASE_URL=postgresql://bennys:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/bennys
      - BETTER_AUTH_SECRET=${SERVICE_BASE64_64_APP}
      - BETTER_AUTH_URL=${SERVICE_FQDN_APP_3000}
      - SEED_ADMIN_USERNAME=${SERVICE_USER_APP}
      - SEED_ADMIN_PASSWORD=${SERVICE_PASSWORD_APP}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # 127.0.0.1 statt localhost: busybox in Alpine löst localhost auf ::1 auf, und im Image gibt es
    # kein curl – nur wget. Der Server horcht auf IPv4 (ENV HOSTNAME=0.0.0.0 im Dockerfile).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_USER=bennys
      - POSTGRES_DB=bennys
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bennys} -d ${POSTGRES_DB:-bennys}"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  pgdata:
  uploads:
