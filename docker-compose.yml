# Deploy-Compose für Coolify. Die Datei muss im Root liegen und `docker-compose.yml` heißen:
# Coolify scannt das Repo und erkennt nur diesen Namen im Root. Für die lokalen Datenbanken steht
# die Dev-Variante daneben (`docker-compose.dev.yml`, die nutzt `npm run db:up`).
#
# Die Variablen sind hier nur Namen – die Werte stehen in Coolify unter Variables. Der Deploy vom
# 2026-11-07 ist genau daran gestorben: eine leere Variable ergibt ein leeres Passwort, Postgres
# initialisiert nicht, der Container wird unhealthy, und `depends_on` wirft die App raus. Darum
# steht hier `:?` – ohne Variable bricht Compose sofort mit dem Namen der Variablen, statt still
# ein kaputtes System zu bauen.
#
# Benötigt (CDD 29, Spec 13.4): POSTGRES_PASSWORD, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
# SEED_ADMIN_USERNAME, SEED_ADMIN_PASSWORD, SEED_RADIO_CHANNEL, SEED_RADIO_PASSWORD.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://bennys:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt – in Coolify unter Variables setzen}@db:5432/bennys
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET fehlt – mindestens 32 Zeichen}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL fehlt – die echte Domain, sonst setzen die Cookies falsch}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:?SEED_ADMIN_USERNAME fehlt – ohne das gibt es keinen Admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD fehlt – ohne das gibt es keinen Admin}
      SEED_RADIO_CHANNEL: ${SEED_RADIO_CHANNEL:-1234}
      SEED_RADIO_PASSWORD: ${SEED_RADIO_PASSWORD:-0000}
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Coolify prüft GET /api/health auf Port 3000. `localhost` geht in Alpine nicht: busybox löst
    # localhost auf ::1 auf, der Server horcht auf IPv4. Siehe Dockerfile (HOSTNAME=0.0.0.0).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: bennys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt – in Coolify unter Variables setzen}
      POSTGRES_DB: bennys
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bennys -d bennys"]
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 10

volumes:
  pgdata:
  uploads:
