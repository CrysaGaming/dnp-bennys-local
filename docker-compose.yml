services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: bennys
      POSTGRES_PASSWORD: bennys
      POSTGRES_DB: bennys
    ports:
      - "5434:5432"
    volumes:
      - bennys-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bennys -d bennys"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:17
    environment:
      POSTGRES_USER: bennys
      POSTGRES_PASSWORD: bennys
      POSTGRES_DB: bennys_test
    ports:
      - "5435:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bennys -d bennys_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bennys-db:
