# Deploy-Compose für Coolify. Sie muss im Root liegen und `docker-compose.yml` heißen – Coolify
# scannt das Repo und erkennt nur diesen Namen im Root.
#
# Coolify legt die Env-Datei selbst an und füllt sie (im Deploy-Lauf ist das
# `/artifacts/<uuid>/.env`, das Compose mit `--env-file` bekommt). Darum steht hier keine
# Interpolation und kein Placeholder: die Namen müssen nur in Coolify existieren. Postgres ist in
# Coolify eine eigene Ressource, ihre Internal URL kommt als `DATABASE_URL` in die Env-Datei.
#
# Die lokalen Datenbanken (5434 Dev, 5435 Test) laufen aus `docker-compose.dev.yml` – das nutzt
# `npm run db:up`. Diese Datei fährt hier nur die App.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads:/app/uploads
    # `localhost` geht in Alpine nicht: busybox löst das auf ::1 auf, und ohne ENV HOSTNAME=0.0.0.0
    # im Dockerfile horcht der Server auf der Container-IP. Beide Punkte sind im Dockerfile gesetzt.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  uploads:
